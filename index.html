<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c2521">
  <meta name="description" content="○と×を交互に置いて、縦・横・斜めに 3 つ並べたら勝ち。ただし盤に残るのは自分の新しい 3 つだけで、4 つ目を置くと一番古い印が消える。CPU 対戦・ふたり対戦。">
  <title>LAST THREE — 残るのは新しい 3 つだけ</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="LAST THREE">
  <meta property="og:title" content="LAST THREE — 残るのは新しい 3 つだけ">
  <meta property="og:description" content="○と×を交互に置いて、縦・横・斜めに 3 つ並べたら勝ち。ただし盤に残るのは自分の新しい 3 つだけで、4 つ目を置くと一番古い印が消える。CPU 対戦・ふたり対戦。">
  <meta property="og:url" content="https://t-of.github.io/last-three/">
  <meta property="og:image" content="https://t-of.github.io/last-three/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LAST THREE">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <!-- タイトル -->
    <section class="title" id="title">
      <div class="title__main">
        <div class="board board--demo" id="demo" aria-hidden="true"></div>
        <h1 class="title__name">LAST THREE</h1>
        <p class="title__lead">残るのは新しい 3 つだけ</p>
        <div class="title__buttons">
          <button class="btn btn--main" id="play-cpu">CPU と対戦</button>
          <div class="seg" role="group" aria-label="CPU と対戦するときの手番">
            <button class="seg__btn" data-side="first">先手（○）</button>
            <button class="seg__btn" data-side="second">後手（×）</button>
          </div>
          <button class="btn" id="play-pvp">ふたりで対戦</button>
          <button class="btn btn--quiet" id="howto">遊び方</button>
        </div>
        <p class="title__stats" id="stats"></p>
      </div>
      <div class="title__foot">
        <div class="title__kit">
          <button class="pill" data-wak="install" hidden>アプリにする</button>
          <button class="pill" data-wak="share">共有</button>
          <button class="pill" data-sound><span>音 オン</span></button>
        </div>
        <footer class="credit"><a href="/">T.OF...</a> のアプリ・<a href="https://t-of.github.io/contact/">問い合わせ</a></footer>
      </div>
    </section>

    <!-- 対局 -->
    <section class="game" id="game" hidden>
      <header class="top">
        <button class="icon-btn" id="quit" aria-label="タイトルへ">×</button>
        <p class="turn" id="turn" aria-live="polite"></p>
        <p class="ply" id="ply"></p>
      </header>
      <div class="board-wrap">
        <div class="hands">
          <div class="hand" id="hand0"></div>
          <div class="hand" id="hand1"></div>
        </div>
        <div class="board" id="board"></div>
      </div>

      <div class="result" id="result" hidden>
        <p class="result__head" id="result-head"></p>
        <p class="result__ply" id="result-ply"></p>
        <div class="result__buttons">
          <button class="btn btn--main" id="again">もう一回</button>
          <button class="btn" id="share-result">共有</button>
          <button class="btn" id="to-title">タイトルへ</button>
        </div>
      </div>
    </section>
  </main>

  <!-- 遊び方 -->
  <dialog class="help" id="help">
    <h2>遊び方</h2>
    <ol>
      <li>○と×が交互に、空いているマスへ印を 1 つ置きます。</li>
      <li>盤に残せる印は<b>ひとり 3 つまで</b>。4 つ目を置くと、<b>自分の一番古い印が消えます</b>。次に消える印は薄く、点線で囲んで見せます。</li>
      <li>縦・横・斜めのどれかに<b>自分の印が 3 つ並んだら勝ち</b>。</li>
    </ol>
    <p class="help__note">同じ形（印の場所・古さの順・手番）が 3 回出たら引き分け。PC では 1〜9 のキー（テンキーの並び）でも置けます。</p>
    <button class="btn btn--main" id="help-close">閉じる</button>
  </dialog>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
